[project]
name = "eds"
version = "0.1.0"
description = "When is a length-of-stay prediction worth acting on? Decision timing for earlier discharge planning."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=7", "flake8>=6"]

[tool.setuptools.packages.find]
where = ["src"]
